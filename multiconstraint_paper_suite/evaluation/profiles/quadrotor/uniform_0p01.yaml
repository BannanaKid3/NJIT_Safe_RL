quadrotor_config:
  seed: 59
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 240
  gui: False
  physics: pyb
  quad_type: 2
  normalized_rl_action_space: True
  norm_act_scale: 0.1
  init_state:
    init_x: 1
    init_x_dot: 0
    init_z: 1
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
  randomized_init: False
  init_state_randomization_info:
    init_x: {distrib: uniform, low: -1.5, high: 1.5}
    init_x_dot: {distrib: uniform, low: -1, high: 1}
    init_z: {distrib: uniform, low: 0.5, high: 1.5}
    init_z_dot: {distrib: uniform, low: -1.5, high: 1.5}
    init_theta: {distrib: uniform, low: -0.2, high: 0.2}
    init_theta_dot: {distrib: uniform, low: -0.1, high: 0.1}
  randomized_inertial_prop: False
  task: stabilization
  task_info:
    stabilization_goal: [0, 1]
    stabilization_goal_tolerance: 0.01
    trajectory_type: circle
    num_cycles: 1
    trajectory_plane: xz
    trajectory_position_offset: [0, 1]
    trajectory_scale: 1
  episode_len_sec: 6
  cost: rl_reward
  rew_exponential: True
  done_on_out_of_bound: True
  done_on_violation: False
  constraints:
    - constraint_form: bounded_constraint
      constrained_variable: input
      lower_bounds: [0.0, 0.0]
      upper_bounds: [0.12, 0.12]
  disturbances:
    dynamics:
      - disturbance_func: uniform
        low: [-0.01, -0.01]
        high: [0.01, 0.01]
